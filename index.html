<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Check INNEXA — Workspace</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-screen" id="loginScreen" hidden>
        <form class="login-card" id="loginForm">
            <h1>⚡ Fast Check INNEXA</h1>
            <p class="subtitle">Inicia sesión para entrar al workspace.</p>
            <div class="form-group" id="loginEmailGroup">
                <label class="form-label" for="loginEmail">Correo</label>
                <input class="form-input" id="loginEmail" type="email" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="loginPassword">Contraseña</label>
                <input class="form-input" id="loginPassword" type="password" autocomplete="current-password" required>
            </div>
            <p class="login-error" id="loginError" hidden></p>
            <button class="btn" type="submit" id="btnLogin">Entrar</button>
        </form>
    </div>

    <div class="container" id="appScreen" hidden>
        <header>
            <div>
                <h1>⚡ Fast Check INNEXA — Workspace</h1>
                <p class="subtitle">Editor colaborativo. Almacenamiento en Supabase + sincronización.</p>
            </div>
            <div class="header-actions">
                <span class="user-email" id="userEmail"></span>
                <button class="btn secondary" id="btnLogout">Salir</button>
                <button class="btn" id="btnNewIdea">+ Nueva Idea</button>
            </div>
        </header>

        <div class="tabs" id="tabs"></div>
        <div id="content"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle"></h2>
                <button class="modal-close" id="btnCloseModal" aria-label="Cerrar">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn secondary" id="btnModalClose">Cerrar</button>
                <button class="btn" id="btnSaveIdea">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
